on:
  push:
    branches:
      - main # work off main branch
  pull_request_target: # this workflow triggers either when there's a push to main OR when a PR is opened/updated/closed
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch: # it also can be triggered manually, and in that case the destination will be required and called "manual_run"
    inputs:
      destination:
        description: "Define destination base path"
        required: true
        default: "manual_run"

permissions: # set permissions
  pull-requests: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  call-workflow:
    uses: FujoWebDev/.github/.github/workflows/deploy-preview-dynamic.yaml@main
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    with:
      REMOTE_TARGET: ${{ vars.REMOTE_TARGET }}
      REMOTE_HOST: ${{ vars.REMOTE_HOST }}
      REMOTE_USER: ${{ vars.REMOTE_USER }}
      PREVIEW_SITE_URL: ${{ vars.PREVIEW_SITE_URL }}
