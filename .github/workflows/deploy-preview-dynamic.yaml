# prettier-ignore
env:
  # runs both on fork PRs and regular PRs
  IS_PR: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
  # The PR number (empty if not a PR)
  PR_NUMBER: ${{ github.event.pull_request.number }}
  # PR head SHA for PRs, branch ref, or whatever ref the user manually triggered the action from
  REF_TO_CHECKOUT: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.sha || github.ref }}

name: Site deploy preview

on:
  workflow_call:
    secrets:
      SSH_PRIVATE_KEY:
        required: true
    inputs:
      REMOTE_TARGET:
        required: true
        type: string
      REMOTE_HOST:
        required: true
        type: string
      REMOTE_USER:
        required: true
        type: string
      PREVIEW_SITE_URL:
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        if: |
          github.event.action != 'closed' &&
          (github.event_name != 'pull_request_target' ||
          contains('MEMBER OWNER COLLABORATOR', github.event.pull_request.author_association))
        permissions:
            pull-requests: write
            contents: read
        steps:
            - name: announce deploy preview attempt
              if: ${{ env.IS_PR == 'true' }}
              uses: thollander/actions-comment-pull-request@v2
              with:
                 message: |
                     Started attempt to build a new deploy preview for PR ${{ env.PR_NUMBER }}.
                 # This makes it easier to find this comment again to update it
                 comment_tag: pr_published
            - name: Checkout your repository using git
              uses: actions/checkout@v4
              with:
                 ref: ${{ env.REF_TO_CHECKOUT }}
            - name: install & build
              run: |
                npm ci
                npm run build
            - name: upload artifacts # upload the built site so that the next step can access it
              uses: actions/upload-artifact@v4
              with:
                path: |
                  dist/
                  server/
                  package.json
                  package-lock.json

    deploy-website:
        runs-on: ubuntu-latest
        # For security reasons, only run this if the PR was authored by someone we know
        if: |
          github.event.action != 'closed' &&
          (github.event_name != 'pull_request_target' ||
          contains('MEMBER OWNER COLLABORATOR', github.event.pull_request.author_association))
        permissions:
          pull-requests: write
          contents: read
        needs: build
        steps:
            - name: Compute deploy path
              # DEPLOY_PATH = REMOTE_TARGET + suffix
              #   PR → /42, push → /branch_name (ref_name), manual → /input_value
              run: |
                if [ "${{ env.IS_PR }}" = "true" ]; then
                  SUFFIX="${{ env.PR_NUMBER }}"
                elif [ "${{ github.event_name }}" = "push" ]; then
                  SUFFIX="${{ github.ref_name }}"
                else
                  SUFFIX="${{ github.event.inputs.destination }}"
                fi
                echo "DEPLOY_PATH=${{ inputs.REMOTE_TARGET }}${SUFFIX}" >> "$GITHUB_ENV"
            - name: Assert DEPLOY_PATH is not the root target
              run: |
                if [ "${{ env.DEPLOY_PATH }}" = "${{ inputs.REMOTE_TARGET }}" ]; then
                  echo "ERROR: DEPLOY_PATH equals REMOTE_TARGET with no suffix."
                  echo "This would deploy to the root and wipe all other deploys."
                  echo "DEPLOY_PATH: ${{ env.DEPLOY_PATH }}"
                  echo "REMOTE_TARGET: ${{ inputs.REMOTE_TARGET }}"
                  exit 1
                fi
            - uses: actions/download-artifact@v4 # download the artifact from the build step
              with:
                  name: artifact
            - run: ls -la # debugging step: check if built files downloaded fine & in the right place
            - name: Deploy to Server
              uses: easingthemes/ssh-deploy@main # deploy via SSH and rsync
              with:
                  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
                  ARGS: "-rlgoDzvc -i --delete" # flags are: recursive, links (recreate symlinks), groups (match groups on target), owner (match owner on target), devices, compress (smaller file size, makes transfer faster), verbose (for debugging), checksum (this is how rsync checks that an update is needed), itemize changes (list all the changes), delete (get rid of files we don't need)
                  SOURCE: "."
                  REMOTE_HOST: ${{ inputs.REMOTE_HOST }} # the target server to push the deployed site files to
                  REMOTE_USER: ${{ inputs.REMOTE_USER }} # the user that the server will operate as for running the files
                  TARGET: ${{ env.DEPLOY_PATH }} # Computed earlier
                  SCRIPT_AFTER: |
                    set -e
                    # Make sure that deploy path exists, or fail silently
                    if [ -z "${{ env.DEPLOY_PATH }}" ]; then
                      echo "ERROR: DEPLOY_PATH is not set"
                      exit 1
                    fi
                    cd ${{ env.DEPLOY_PATH }} # this is used again but to determine what the branch name is and change directories to it
                    # after the files get uploaded, we enter the new directory and install the dependencies now on the server
                    npm ci
            - name: update PR
              if: ${{ env.IS_PR == 'true' }}
              uses: thollander/actions-comment-pull-request@v2 # if there's a PR, update it with a comment that a new deploy preview has been created
              with:
                  message: |
                      Created a new deploy preview for PR ${{ env.PR_NUMBER }}. [See preview](${{ inputs.PREVIEW_SITE_URL }}/${{ env.PR_NUMBER }}/).
                  comment_tag: pr_published

    cleanup-preview:
        runs-on: ubuntu-latest
        if: ${{ github.event.action == 'closed' }}
        permissions:
          pull-requests: write
        steps:
            - name: Remove preview from server
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ inputs.REMOTE_HOST }}
                  username: ${{ inputs.REMOTE_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                    DEPLOY_PATH="${{ inputs.REMOTE_TARGET }}${{ github.event.pull_request.number }}"
                    if [ -d "$DEPLOY_PATH" ]; then
                      rm -rf "$DEPLOY_PATH"
                      echo "Removed preview at $DEPLOY_PATH"
                    else
                      echo "No preview found at $DEPLOY_PATH"
                    fi
            - name: Comment on PR
              uses: thollander/actions-comment-pull-request@v2
              with:
                  message: |
                      Preview for PR ${{ github.event.pull_request.number }} has been cleaned up.
                  comment_tag: pr_published
